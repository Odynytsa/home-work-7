<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display та Box-sizing</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <h1>Display та Box-sizing</h1>

    <div class="display-block">display: block</div>

    <span class="display-inline">display: inline</span>
    <span class="display-inline">Другий inline</span>

    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>

    <div class="box-sizing-box">
        Box-sizing: border-box
    </div>
</body>

</html>
