<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блокові та інлайнові елементи</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <h1>Блокові та інлайнові елементи</h1>

    <div class="block">Перший блок div</div>
    <div class="block">Другий блок div</div>

    <p>
        Це приклад <span class="inline">інлайнового span</span>
        всередині тексту.
    </p>

    <p>
        Інлайнові елементи не переносяться на новий рядок,
        а блокові займають всю ширину.
    </p>
</body>

</html>
