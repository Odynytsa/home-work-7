<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float та Clear</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <h1>Float та Clear</h1>

    <div class="float-box left">Float Left</div>
    <div class="float-box right">Float Right</div>

    <p>
        Текст обтікає елементи з float.
        Це старий спосіб створення макетів.
    </p>

    <div class="clear-box">
        Тут використовується clear: both.
    </div>
</body>

</html>
